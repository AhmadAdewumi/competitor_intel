<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CompetitorIntel</title>
    <style>
        /* ============================================
           DESIGN TOKENS & VARIABLES
           ============================================ */
        :root {
            /* Palette */
            --bg-base: #0a0a0a;
            --bg-panel: #141414;
            --bg-panel-hover: #1a1a1a;
            --bg-input: #121212;

            --border-subtle: #222222;
            --border-strong: #333333;
            --border-focus: #3b82f6;

            --text-primary: #ededed;
            --text-secondary: #888888;
            --text-muted: #555555;

            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-muted: rgba(59, 130, 246, 0.15);

            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;

            /* Typography */
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

            /* Layout & FX */
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 12px;
            --transition: 0.15s ease;
            --shadow-modal: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 24px 48px rgba(0, 0, 0, 0.8);

            /* Responsive variables */
            --container-padding: 24px;
        }

        @media (max-width: 640px) {
            :root {
                --container-padding: 16px;
            }
        }

        /* ============================================
           RESET & BASE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-y: scroll;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ============================================
           TYPOGRAPHY & UTILITIES
           ============================================ */
        h1, h2, h3, h4 {
            font-weight: 500;
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--container-padding);
        }

        .icon {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            height: 64px;
            display: flex;
            align-items: center;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 12px;
        }

        .logo {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .logo-mark {
            width: 20px;
            height: 20px;
            background: var(--text-primary);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-base);
            flex-shrink: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Hide text on small screens, adjust gaps */
        @media (max-width: 768px) {
            .status-badge-text {
                display: none;
            }

            .btn-new-topic-text {
                display: none;
            }

            .header-actions {
                gap: 6px;
            }

            .btn {
                padding: 0 10px;
            }

            .logo {
                font-size: 0;
            }

            /* Hide "CompetitorIntel" text on very small screens */
            .logo-mark {
                width: 24px;
                height: 24px;
            }
        }

        /* Custom Select Styling for Header */
        select.btn {
            appearance: none;
            -webkit-appearance: none;
            background-color: var(--bg-panel);
            color: var(--text-primary);
            padding-right: 24px !important;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23888888%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 8px top 50%;
            background-size: 8px auto;
        }

        /* ============================================
           BUTTONS
           ============================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 14px;
            height: 32px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            outline: none;
            white-space: nowrap;
        }

        .btn:focus-visible {
            box-shadow: 0 0 0 2px var(--bg-base), 0 0 0 4px var(--border-focus);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-outline {
            background: transparent;
            border-color: var(--border-subtle);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background: var(--bg-panel);
            border-color: var(--border-strong);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-ghost:hover {
            background: var(--bg-panel);
            color: var(--text-primary);
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .btn-icon {
            padding: 0;
            width: 32px;
            flex-shrink: 0;
        }

        /* ============================================
           BADGES & STATUS
           ============================================ */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
        }

        .status-running .status-dot {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse-dot 2s infinite;
        }

        .status-success .status-dot {
            background: var(--success);
        }

        .status-error .status-dot {
            background: var(--danger);
        }

        @keyframes pulse-dot {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ============================================
           MAIN CONTENT & TOPICS GRID
           ============================================ */
        .main {
            padding: 32px 0 120px;
        }

        .page-header {
            display: flex;
            flex-direction: column;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        .page-desc {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        @media (max-width: 640px) {
            .topics-grid {
                grid-template-columns: 1fr;
            }
        }

        .topic-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 20px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .topic-card:hover {
            border-color: var(--border-strong);
            background: var(--bg-panel-hover);
        }

        .topic-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 12px;
        }

        .topic-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            word-break: break-word;
        }

        .topic-description {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .topic-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .meta-item svg {
            stroke: var(--text-muted);
        }

        .topic-actions {
            display: flex;
            gap: 8px;
            padding-top: 16px;
            border-top: 1px solid var(--border-subtle);
            opacity: 0.6;
            transition: var(--transition);
            flex-wrap: wrap; /* Critical for mobile: allows 6 buttons to wrap */
        }

        .topic-card:hover .topic-actions {
            opacity: 1;
        }

        /* Mobile specific topic action button wrapping */
        @media (max-width: 640px) {
            .topic-actions {
                opacity: 1; /* Always visible on touch devices */
                justify-content: flex-start;
            }

            .topic-actions .btn {
                flex: 1 1 calc(33.333% - 8px); /* Make buttons fill rows nicely */
                padding: 0;
            }

            /* Override the margin-left:auto on the delete button for mobile so it fits the grid */
            .topic-actions .btn-danger {
                margin-left: 0 !important;
            }
        }

        /* Skeletons */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-panel) 25%, var(--border-subtle) 50%, var(--bg-panel) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        @keyframes loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 64px 20px;
            text-align: center;
            border: 1px dashed var(--border-strong);
            border-radius: var(--radius-md);
        }

        .empty-state svg {
            width: 32px;
            height: 32px;
            stroke: var(--text-muted);
            margin-bottom: 16px;
        }

        /* ============================================
           TRACE PANEL (Terminal Style)
           ============================================ */
        .trace-panel {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 500px;
            max-width: calc(100vw - 48px);
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            transform: translateY(120%);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            z-index: 50;
        }

        .trace-panel.open {
            transform: translateY(0);
            opacity: 1;
        }

        .trace-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--bg-panel);
            border-radius: var(--radius-md) var(--radius-md) 0 0;
        }

        .trace-title {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .trace-body {
            height: 350px;
            padding: 16px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        .trace-entry {
            display: grid;
            grid-template-columns: 60px auto;
            gap: 12px;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .trace-time {
            color: var(--text-muted);
        }

        .trace-content-wrapper {
            display: flex;
            flex-direction: column;
        }

        .trace-agent {
            color: var(--accent);
            font-weight: 500;
            display: inline-block;
            margin-right: 6px;
        }

        .trace-action {
            color: var(--text-primary);
        }

        .trace-detail {
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .trace-entry.error .trace-agent {
            color: var(--danger);
        }

        .trace-entry.success .trace-agent {
            color: var(--success);
        }

        @media (max-width: 640px) {
            .trace-panel {
                bottom: 0;
                right: 0;
                width: 100%;
                max-width: 100%; /* Changed from 100vw to 100% */
                border-radius: 12px 12px 0 0;
                border-left: none;
                border-right: none;
                border-bottom: none;
                /* Add safe area padding for mobile browsers */
                padding-bottom: env(safe-area-inset-bottom);
            }

            .trace-header {
                border-radius: 12px 12px 0 0;
            }

            .trace-body {
                height: 40vh;
            }

            .trace-entry {
                grid-template-columns: 50px auto;
                gap: 8px;
            }
        }

        /* ============================================
           MODAL & FORMS
           ============================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition);
            padding: var(--container-padding);
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 520px;
            box-shadow: var(--shadow-modal);
            transform: scale(0.97);
            transition: transform var(--transition);
            max-height: 100%;
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.open .modal-content {
            transform: scale(1);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 500;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background: var(--bg-panel);
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-strong);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color var(--transition);
            outline: none;
            appearance: none;
        }

        @media screen and (-webkit-min-device-pixel-ratio: 0) {
            select.form-control,
            textarea.form-control,
            input.form-control {
                font-size: 16px;
            }

            /* Prevents iOS zoom */
        }

        select.form-control {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23888888%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 10px auto;
            padding-right: 32px;
        }

        .form-control:focus {
            border-color: var(--border-focus);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .help-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .modal-content {
                max-height: calc(100vh - 32px);
            }

            .modal-footer {
                flex-direction: column;
            }

            .modal-footer .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<!-- App Container -->
<div class="app">

    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <div class="logo">
                <div class="logo-mark">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M2 12h4l3-9 5 18 3-9h5"/>
                    </svg>
                </div>
                CompetitorIntel
            </div>
            <div class="header-actions">

                <!-- Model Selector -->
                <select id="model-selector" class="btn btn-outline"
                        style="height:32px; font-size:12px; cursor:pointer;">
                    <option value="groq">⚡ Groq</option>
                    <option value="openrouter">🌐 OpenRouter</option>
                </select>

                <span class="status-badge">
                    <span class="status-dot" style="background:var(--success)"></span>
                    <span class="status-badge-text">Scheduler Active</span>
                </span>

                <button class="btn btn-outline btn-icon" id="btn-refresh" aria-label="Refresh" title="Refresh (R)">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M21 2v6h-6"/>
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 2v6h6"/>
                    </svg>
                </button>
                <button class="btn btn-primary" id="btn-new-topic" title="New Topic (N)">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    <span class="btn-new-topic-text">New Topic</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main container">
        <div class="page-header">
            <div>
                <h1 class="page-title">Research Topics</h1>
                <p class="page-desc">Automated intelligence gathering agents.</p>
            </div>
        </div>

        <div class="topics-grid" id="topics-container">
            <!-- Initial Skeleton Loading State -->
            <div class="topic-card">
                <div class="skeleton" style="height: 20px; width: 60%; margin-bottom: 16px;"></div>
                <div class="skeleton" style="height: 14px; width: 100%; margin-bottom: 8px;"></div>
                <div class="skeleton" style="height: 14px; width: 80%; margin-bottom: 24px;"></div>
                <div class="skeleton" style="height: 12px; width: 40%; margin-bottom: 12px;"></div>
                <div class="skeleton" style="height: 12px; width: 50%;"></div>
            </div>
            <div class="topic-card">
                <div class="skeleton" style="height: 20px; width: 70%; margin-bottom: 16px;"></div>
                <div class="skeleton" style="height: 14px; width: 90%; margin-bottom: 8px;"></div>
                <div class="skeleton" style="height: 14px; width: 70%; margin-bottom: 24px;"></div>
                <div class="skeleton" style="height: 12px; width: 45%; margin-bottom: 12px;"></div>
                <div class="skeleton" style="height: 12px; width: 30%;"></div>
            </div>
        </div>
    </main>

    <!-- Trace Panel (Terminal style slide-in) -->
    <div class="trace-panel" id="trace-panel">
        <div class="trace-header">
            <div class="trace-title">
                <span class="status-dot"></span>
                <span id="trace-title-text">Agent Execution Trace</span>
            </div>
            <button class="btn btn-ghost btn-icon" id="btn-close-trace" title="Close (Esc)">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="trace-body" id="trace-body">
            <!-- Trace lines injected here via JS -->
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div class="modal-overlay" id="topic-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Create Topic</h3>
                <button class="btn btn-ghost btn-icon" id="btn-close-modal">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="topic-form" onsubmit="event.preventDefault(); window.saveTopic();">
                    <div class="form-group">
                        <label class="form-label" for="topic-name">Topic Name</label>
                        <input type="text" class="form-control" id="topic-name"
                               placeholder="e.g., Enterprise AI Chatbots" autocomplete="off" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="topic-description">Goal / Prompt Description</label>
                        <textarea class="form-control" id="topic-description"
                                  placeholder="Analyze pricing models and feature sets..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="topic-search-terms">Search Terms</label>
                        <textarea class="form-control" id="topic-search-terms"
                                  placeholder="enterprise ai chatbots 2026&#10;intercom vs zendesk ai"></textarea>
                        <div class="help-text">One search term per line.</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="topic-urls">Target URLs (Optional)</label>
                        <textarea class="form-control" id="topic-urls"
                                  placeholder="https://intercom.com/pricing&#10;https://zendesk.com"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="topic-schedule-freq">Schedule</label>
                            <select class="form-control" id="topic-schedule-freq">
                                <option value="">Manual Only</option>
                                <option value="daily">Daily</option>
                                <option value="weekly">Weekly</option>
                                <option value="monthly">Monthly</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="topic-email">Delivery Email</label>
                            <input type="email" class="form-control" id="topic-email" placeholder="reports@company.com">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="btn-cancel-modal">Cancel</button>
                <button class="btn btn-primary" id="btn-save-topic" onclick="window.saveTopic()">Save Topic</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        'use strict';

        // ============================================
        // STATE & CONFIG
        // ============================================
        let topics = [];
        let currentRunId = null;
        let eventSource = null;
        let editingTopicId = null;

        // DOM Elements
        const DOM = {
            container: document.getElementById('topics-container'),
            tracePanel: document.getElementById('trace-panel'),
            traceBody: document.getElementById('trace-body'),
            traceTitle: document.getElementById('trace-title-text'),
            traceDot: document.querySelector('#trace-panel .status-dot'),
            modal: document.getElementById('topic-modal'),
            modalTitle: document.getElementById('modal-title'),
            form: document.getElementById('topic-form')
        };

        // ============================================
        // MODEL SELECTOR LOGIC (Groq & OpenRouter only)
        // ============================================

        const modelSelector = document.getElementById('model-selector');

        async function loadCurrentModel() {
            try {
                const response = await fetch('/api/settings');
                const settings = await response.json();
                const currentProvider = settings.llm_provider || 'groq';
                modelSelector.value = currentProvider;
            } catch (e) {
                console.error('Failed to load model setting:', e);
                modelSelector.value = 'groq';
            }
        }

        async function switchModel(provider) {
            try {
                modelSelector.value = provider;

                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({llm_provider: provider})
                });

                if (!response.ok) throw new Error('Failed to save model setting');

                showToast(`Switched to ${provider === 'groq' ? 'Groq' : 'OpenRouter'}`);

            } catch (e) {
                console.error('Failed to switch model:', e);
                const current = await getCurrentModel();
                modelSelector.value = current;
                showToast('Failed to switch model', 'error');
            }
        }

        async function getCurrentModel() {
            try {
                const response = await fetch('/api/settings');
                const settings = await response.json();
                return settings.llm_provider || 'groq';
            } catch {
                return 'groq';
            }
        }

        modelSelector.addEventListener('change', function () {
            switchModel(this.value);
        });

        loadCurrentModel();

        // Toast notification function
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.style.cssText = `
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: ${type === 'error' ? '#ef4444' : '#10b981'};
        color: #0a0a0a;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        z-index: 999;
        opacity: 0;
        transition: opacity 0.3s ease;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    `;
            toast.textContent = message;
            document.body.appendChild(toast);

            requestAnimationFrame(() => {
                toast.style.opacity = '1';
            });

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // SVG Icons Map (Clean inline rendering)
        const ICONS = {
            search: '<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
            link: '<svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
            mail: '<svg class="icon" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>',
            calendar: '<svg class="icon" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'
        };

        // ============================================
        // API INTEGRATION
        // ============================================

        // Helper to handle fetches with NO mock fallback
        async function fetchWithMockFallback(url, options = {}) {
            const res = await fetch(url, options);
            if (!res.ok) throw new Error(`API Error: ${res.status}`);
            return await res.json();
        }

        async function fetchTopics() {
            const data = await fetchWithMockFallback('/api/topics');
            topics = data.topics || [];
            renderTopics();
        }

        async function runTopic(topicId) {
            // Update local UI immediately for responsiveness
            const topic = topics.find(t => t.id === topicId);
            if (topic) topic.running = true;
            renderTopics();

            const data = await fetchWithMockFallback(`/api/topics/${topicId}/run`, {method: 'POST'});
            if (data.run_id) {
                currentRunId = data.run_id;
                openTracePanel(data.run_id);
                startSSE(data.run_id);
            }
        }

        // ============================================
        // RENDER LOGIC
        // ============================================

        function renderTopics() {
            if (!topics || topics.length === 0) {
                DOM.container.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18" stroke="currentColor" stroke-width="2"/></svg>
                            <h3 style="margin-bottom: 4px;">No Research Topics</h3>
                            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 16px;">Create a topic to start gathering intelligence.</p>
                            <button class="btn btn-primary" onclick="window.openModal()">Create First Topic</button>
                        </div>
                    `;
                return;
            }

            let html = '';
            topics.forEach(topic => {
                const status = getTopicStatus(topic);

                // Safely extract counts
                const termsCount = Array.isArray(topic.search_terms) ? topic.search_terms.length : 0;
                const urlsCount = Array.isArray(topic.urls) ? topic.urls.length : 0;

                html += `
                        <div class="topic-card">
                            <div class="topic-header">
                                <span class="topic-name">${escapeHtml(topic.name)}</span>
                                <div class="status-badge ${status.class}">
                                    <span class="status-dot"></span>
                                    ${status.label}
                                </div>
                            </div>

                            <div class="topic-description">
                                ${escapeHtml(topic.description || 'No description provided.')}
                            </div>

                            <div class="topic-meta">
                                <div class="meta-item" title="Search Terms">${ICONS.search} ${termsCount} terms</div>
                                <div class="meta-item" title="Target URLs">${ICONS.link} ${urlsCount} URLs</div>
                                <div class="meta-item" title="Schedule">${ICONS.calendar} <span style="text-transform:capitalize">${topic.schedule_frequency || 'Manual'}</span></div>
                                ${topic.email ? `<div class="meta-item" title="Delivery">${ICONS.mail} ${escapeHtml(topic.email)}</div>` : ''}
                            </div>

                            <div class="topic-actions">
                                <button class="btn btn-primary" onclick="window.runTopic(${topic.id})" ${topic.running ? 'disabled' : ''}>
                                    <svg class="icon" viewBox="0 0 24 24" style="fill:currentColor; stroke:none; width:12px; height:12px"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                    Run
                                </button>
                                <button class="btn btn-outline" onclick="window.downloadReport(${topic.id}, 'pdf')" title="Download PDF">PDF</button>
                                <button class="btn btn-outline" onclick="window.downloadReport(${topic.id}, 'html')" title="Download HTML">HTML</button>
                                <button class="btn btn-outline" onclick="window.downloadReport(${topic.id}, 'md')" title="Download Markdown">MD</button>
                                <button class="btn btn-outline" onclick="window.editTopic(${topic.id})">Edit</button>
                                <button class="btn btn-danger" style="margin-left:auto" onclick="window.deleteTopic(${topic.id})">Delete</button>
                            </div>
                        </div>
                    `;
            });
            DOM.container.innerHTML = html;
        }

        function getTopicStatus(topic) {
            if (topic.running) return {label: 'Running...', class: 'status-running'};
            if (topic.latest_report) {
                if (topic.latest_report.status === 'failed') return {label: 'Failed', class: 'status-error'};
                return {label: formatTime(topic.latest_report.created_at), class: 'status-success'};
            }
            return {label: 'Pending', class: ''};
        }

        // ============================================
        // TRACE PANEL & SSE LOGIC
        // ============================================

        function openTracePanel(runId) {
            DOM.tracePanel.classList.add('open');
            DOM.traceTitle.textContent = `Execution Trace (${runId})`;
            DOM.traceDot.style.background = 'var(--warning)';
            DOM.traceDot.parentElement.classList.add('status-running');
            DOM.traceBody.innerHTML = '<div style="color:var(--text-muted)">> Initializing agents...</div>';
        }

        function closeTracePanel() {
            DOM.tracePanel.classList.remove('open');
            if (eventSource && typeof eventSource.close === 'function') {
                eventSource.close();
                eventSource = null;
            }
        }

        function startSSE(runId) {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }

            console.log(`Connecting to SSE: /api/stream/${runId}`);

            try {
                eventSource = new EventSource(`/api/stream/${runId}`);

                eventSource.onopen = function () {
                    console.log('SSE connection opened');
                };

                eventSource.onmessage = function (e) {
                    try {
                        const data = JSON.parse(e.data);
                        // Ignore ping events
                        if (data.type === 'ping') {
                            console.log('SSE ping received');
                            return;
                        }
                        handleTraceEvent(data);
                    } catch (err) {
                        console.error('Failed to parse SSE data:', err);
                    }
                };

                eventSource.onerror = function (e) {
                    console.log('SSE error:', e);
                    if (eventSource.readyState === EventSource.CLOSED) {
                        console.log('SSE connection closed, attempting to reconnect...');
                        setTimeout(() => {
                            if (currentRunId) {
                                startSSE(currentRunId);
                            }
                        }, 3000);
                    }
                };

            } catch (e) {
                console.error('Failed to create EventSource:', e);
            }
        }

        function handleTraceEvent(event) {
            if (event.type === 'trace') {
                appendTrace(event.data);
            } else if (event.type === 'complete') {
                appendTrace({
                    agent: 'System',
                    action: event.data.status === 'success' ? 'Report Generated ✅' : 'Failed ❌'
                });
                DOM.traceDot.style.background = event.data.status === 'success' ? 'var(--success)' : 'var(--danger)';
                DOM.traceDot.parentElement.classList.remove('status-running');
                if (eventSource) eventSource.close();
                fetchTopics(); // Refresh state
            }
        }

        function appendTrace(trace) {
            const entry = document.createElement('div');
            const isError = trace.action && trace.action.toLowerCase().includes('failed');
            entry.className = `trace-entry ${isError ? 'error' : trace.agent === 'System' ? 'success' : ''}`;

            const timeStr = new Date().toLocaleTimeString('en-US', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            entry.innerHTML = `
                    <span class="trace-time">[${timeStr}]</span>
                    <div class="trace-content-wrapper">
                        <div>
                            <span class="trace-agent">${escapeHtml(trace.agent || 'Sys')}</span>
                            <span class="trace-action">${escapeHtml(trace.action || '')}</span>
                        </div>
                        ${trace.content ? `<div class="trace-detail">${escapeHtml(trace.content)}</div>` : ''}
                    </div>
                `;

            DOM.traceBody.appendChild(entry);
            DOM.traceBody.scrollTop = DOM.traceBody.scrollHeight; // Auto-scroll
        }

        // ============================================
        // MODAL & FORM LOGIC
        // ============================================

        window.openModal = function (topicId = null) {
            editingTopicId = topicId;
            DOM.form.reset();

            if (topicId) {
                const t = topics.find(x => x.id === topicId);
                DOM.modalTitle.textContent = 'Edit Topic';
                if (t) {
                    document.getElementById('topic-name').value = t.name || '';
                    document.getElementById('topic-description').value = t.description || '';
                    document.getElementById('topic-search-terms').value = (t.search_terms || []).join('\n');
                    document.getElementById('topic-urls').value = (t.urls || []).join('\n');
                    document.getElementById('topic-email').value = t.email || '';
                    document.getElementById('topic-schedule-freq').value = t.schedule_frequency || '';
                }
            } else {
                DOM.modalTitle.textContent = 'New Topic';
            }

            DOM.modal.classList.add('open');

            // Only auto-focus on non-touch devices to prevent keyboard popping up immediately
            if (!window.matchMedia("(pointer: coarse)").matches) {
                setTimeout(() => document.getElementById('topic-name').focus(), 100);
            }
        };

        window.closeModal = function () {
            DOM.modal.classList.remove('open');
            editingTopicId = null;
        };

        window.saveTopic = async function () {
            const name = document.getElementById('topic-name').value.trim();
            if (!name) return;

            const data = {
                name,
                description: document.getElementById('topic-description').value.trim(),
                search_terms: document.getElementById('topic-search-terms').value.split('\n').filter(s => s.trim()),
                urls: document.getElementById('topic-urls').value.split('\n').filter(s => s.trim()),
                email: document.getElementById('topic-email').value.trim(),
                schedule_frequency: document.getElementById('topic-schedule-freq').value
            };

            const method = editingTopicId ? 'PUT' : 'POST';
            const url = editingTopicId ? `/api/topics/${editingTopicId}` : '/api/topics';

            try {
                // Update mock local state for preview
                if (!editingTopicId) {
                    topics.push({id: Date.now(), ...data, running: false});
                } else {
                    const idx = topics.findIndex(t => t.id === editingTopicId);
                    if (idx > -1) topics[idx] = {...topics[idx], ...data};
                }

                await fetchWithMockFallback(url, {
                    method,
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                window.closeModal();
                renderTopics();
            } catch (e) {
                console.error('Save failed', e);
            }
        };

        window.deleteTopic = async function (id) {
            if (confirm('Delete this research topic completely?')) {
                topics = topics.filter(t => t.id !== id);
                renderTopics();
                await fetchWithMockFallback(`/api/topics/${id}`, {method: 'DELETE'});
            }
        };

        // ============================================
        // REPORT DOWNLOAD LOGIC
        // ============================================

        window.downloadReport = async function (topicId, format) {
            try {
                const response = await fetch(`/api/topics/${topicId}/report?format=${format}`);

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to download report');
                }

                const blob = await response.blob();
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = `report_${topicId}.${format}`;
                if (contentDisposition) {
                    const match = contentDisposition.match(/filename=(.+)/);
                    if (match) filename = match[1];
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showToast(`Downloaded ${format.toUpperCase()} report`);
            } catch (e) {
                console.error('Download failed:', e);
                showToast(e.message || 'No report available for this topic', 'error');
            }
        };
        // ============================================
        // UTILS & EVENT BINDINGS
        // ============================================

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatTime(ts) {
            if (!ts) return 'Never';
            const diff = new Date() - new Date(ts);
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
            return new Date(ts).toLocaleDateString();
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.closeModal();
                closeTracePanel();
            }
            if (e.key.toLowerCase() === 'n' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
                window.openModal();
            }
            if (e.key.toLowerCase() === 'r' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                fetchTopics();
            }
            // Cmd/Ctrl + Enter to save
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && DOM.modal.classList.contains('open')) {
                window.saveTopic();
            }
        });

        // Bindings
        document.getElementById('btn-new-topic').addEventListener('click', () => window.openModal());
        document.getElementById('btn-refresh').addEventListener('click', fetchTopics);
        document.getElementById('btn-close-trace').addEventListener('click', closeTracePanel);
        document.getElementById('btn-close-modal').addEventListener('click', window.closeModal);
        document.getElementById('btn-cancel-modal').addEventListener('click', window.closeModal);

        // Close modal on outside click
        DOM.modal.addEventListener('click', e => {
            if (e.target === DOM.modal) window.closeModal();
        });

        // ============================================
        // MOCK DATA GENERATOR (Removed for Production)
        // ============================================

        // Init
        window.runTopic = runTopic;
        window.editTopic = window.openModal;

        // Initial fetch with slight delay to show skeleton
        setTimeout(fetchTopics, 800);

    })();
</script>
</body>
</html>
